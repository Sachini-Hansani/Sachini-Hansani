<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="154" viewBox="0 0 1100 154" role="img" aria-labelledby="title desc">
  <title id="title">Building ideas into code</title>
  <desc id="desc">Subtle purple color-wave lettering for Sachini Hansani's software development profile.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16142A"/>
      <stop offset="0.52" stop-color="#23183D"/>
      <stop offset="1" stop-color="#161328"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C4AB6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#AD8BFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#6C4AB6" stop-opacity="0"/>
    </linearGradient>
    <style>
      .letter { fill: #DCCEFF; animation: colorWave 4.2s ease-in-out infinite; }
      .lineMotion { animation: lineGlow 4.2s ease-in-out infinite; }
      @keyframes colorWave {
        0%, 20%, 85%, 100% { fill: #DCCEFF; }
        36% { fill: #FFFFFF; }
        48% { fill: #AA7BFF; }
        60% { fill: #A6E6FF; }
      }
      @keyframes lineGlow {
        0%, 100% { opacity: .45; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .letter, .lineMotion { animation: none; }
      }
    </style>
  </defs>
  <rect x="2" y="2" width="1096" height="150" rx="22" fill="url(#background)" stroke="#48336A" stroke-width="2"/>
  <circle cx="48" cy="38" r="4" fill="#9B79F5" opacity=".55"/>
  <circle cx="65" cy="38" r="4" fill="#9B79F5" opacity=".35"/>
  <circle cx="82" cy="38" r="4" fill="#9B79F5" opacity=".2"/>
